name: Validate GitHub Trending News PR

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'site/**'
      - 'README.md'
      - '.github/workflows/pr-validation.yml'

# No write token, no repository secrets, and no collection/deployment on PRs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Python parser, enrich, and history tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check site/assets/app.js
