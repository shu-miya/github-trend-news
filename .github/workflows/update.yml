name: Collect GitHub Trending
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 0 * * *' # 09:17 JST (may be delayed)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-trend-news-pages
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, archive, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test parser and archive safety
        run: python -m unittest discover -s tests -v
      - name: Fetch daily, weekly, and monthly Trending
        env:
          GH_TREND_TOKEN: ${{ github.token }}
        run: python -m src.collect
      - name: Save successful snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/index.json site/data/latest.json site/data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "data: capture GitHub Trending charts"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
